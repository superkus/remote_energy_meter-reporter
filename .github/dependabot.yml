version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    labels: [dependencies]
    groups:
      runtime: { dependency-type: production }
      development: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    labels: [dependencies, ci]
