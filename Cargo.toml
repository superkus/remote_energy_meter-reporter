[package]
name = "remote-energy-meter-reporter"
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
description = "Native zero-trust whole-system power reporter for Remote Energy Meter"
license = "MIT"
repository = "https://github.com/superkus/remote_energy_meter-reporter"
publish = false

[lib]
name = "remote_energy_meter_reporter"
path = "src/lib.rs"

[[bin]]
name = "remote-energy-meter-reporter"
path = "src/main.rs"

[dependencies]
hkdf = { version = "=0.13.0", default-features = false }
idna = { version = "=1.1.0", default-features = false, features = ["alloc", "compiled_data"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
sha2 = { version = "=0.11.1", default-features = false }
subtle = { version = "=2.6.1", default-features = false }

[dev-dependencies]
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "getrandom"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
io-kit-sys = "=0.5.0"
